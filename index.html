

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Finanz Tracker</title>

  <!-- Manifest für Android/Chrome (Cache-Busting mit ?v=2) -->
  <link rel="manifest" href="./manifest.json?v=2">

  <!-- iOS: Home-Screen-Icons (Safari ignoriert Manifest-Icons) -->
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">

  <!-- iOS: PWA-Optik -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanz Tracker">

  <!-- Farben (Android Task-Switcher / Adressleiste) -->
  <meta name="theme-color" content="#00d4ff">
  <meta name="background-color" content="#0b1220">

<style>
 /* ============================================================
   1) GLOBAL BASIS — RESET, BODY, FONT, LAYOUT
   ============================================================ */

* {
  box-sizing: border-box;
}



@media (max-width: 900px) {

  :root{
    --bg: #0b1220;
    --panel: #161a22;
    --text: #e6eef8;
    --muted: rgba(255,255,255,.06);
    --muted2: rgba(255,255,255,.12);
    --border: rgba(255,255,255,.12);
    --accent: #00d4ff;
    --danger: #a50000;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 2px 30px rgba(0,0,0,.55);
    --h: 48px;
    --gap: 12px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 14px;
    min-height: 100%;
    font-family: Inter, "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-y: auto;
  }

  h1{
    text-align: center;
    font-weight: 300;
    margin: 6px 0 18px;
    font-size: 1.35rem;
  }

  /* ===== Layout: Panels untereinander ===== */
  .container{
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .panel-left,
  .panel-right,
  .analysis-panel{
    background: var(--panel);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: none;
    padding: 18px;
    height: auto;
    overflow: visible;
  }

  .paper{
    background: var(--panel);
    border-radius: var(--radius);
    border: none;
    box-shadow: none;
    height: auto;
    overflow: visible;
  }

  .panel-left h2,
  .panel-right h2,
  .analysis-panel h2{
    text-align: center;
    margin: 0 0 14px;
  }

  /* ===== Fields ===== */
  .field{
    position: relative;
    margin-bottom: 14px;
    min-width: 0;
    flex: 1;
  }

  .field input,
  .field select{
    width: 100%;
    height: var(--h);
    padding: 12px 12px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--muted);
    color: var(--text);
    font-size: 1rem;
    outline: none;
  }

  /* Mobile: Hover/Fokus ruhig (kein Glow) */
  .field input:hover,
  .field select:hover,
  .field input:focus,
  .field select:focus{
    background: var(--muted);
    box-shadow: none !important;
    outline: none !important;
  }

  /* ===== Floating Label Engine (einmal, sauber) ===== */
  .field label{
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1rem;
    pointer-events: none;
    background: transparent;
    transition: .2s ease;
    color: var(--text);
    padding: 0 4px;
    line-height: 1;
  }

  .field:focus-within label,
  .field.filled label{
    top: -8px;
    left: 10px;
    transform: none;
    font-size: .78rem;
    color: var(--accent);
    padding: 0 6px;
    border-radius: 4px;
  }

  /* ===== Date Input (links) ===== */
  #dateInput{
    text-align: center;
    text-align-last: center;
    -webkit-appearance: none;
    appearance: none;
  }
  #dateInput::-webkit-calendar-picker-indicator{
    opacity: 0;
    display: none;
  }

  /* ===== Radio ===== */
  .radio-group{
    display: flex;
    justify-content: center;
    gap: 40px;
    margin: 8px 0 16px;
  }
  input[type="radio"]{
    accent-color: var(--accent);
  }

  /* ===== Right Panel Filter row ===== */
  .field-group{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }

  /* Jahr/Monat/Tag: 3 Spalten, dann Kat/Tag: 2 Spalten */
  .panel-right .field-group .field:nth-child(1),
  .panel-right .field-group .field:nth-child(2),
  .panel-right .field-group .field:nth-child(3){
    flex: 1 1 calc(33.333% - 10px);
  }
  .panel-right .field-group .field:nth-child(4),
  .panel-right .field-group .field:nth-child(5){
    flex: 1 1 calc(50% - 10px);
  }
	
  .panel-right .field-group{
    gap: 10px !important;          /* Abstand horizontal + vertikal */
    margin-bottom: 20px !important;
  }

  /* Wichtig: Extra-Spacing unter jedem Feld entfernen (nur in der field-group) */
  .panel-right .field-group .field{
    margin-bottom: 0 !important;
  }

  /* ===== Entries ===== */
  .entry{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    background: rgba(255,255,255,.88);
    border: 1px solid rgba(255,255,255,.10);
  }

  .meta{ color: #002366; flex: 1; }
  .small{ font-size: .85rem; color: #000; }
  .amount-income{ color: #218838; font-weight: 700; }
  .amount-expense{ color: #c82333; font-weight: 700; }

  .balance{
    margin-top: 12px;
    padding: 12px 0 10px;
    text-align: center;
    font-weight: 700;
  }

  /* ===== Buttons: kompakt + 3 Reihen ===== */
  .action-row{
    display: flex;
    gap: 10px;
    margin: 4px 0; /* 🔥 enger zusammen */
  }

  .action-row button{
    height: var(--h);
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    font-weight: 700;
    font-size: 1rem;
  }

  .primary{
    background: linear-gradient(135deg, var(--accent), #007bff);
    color: #fff;
  }

  .ghost{
    background: transparent;
    border: 1px solid rgba(255,255,255,.12);
    color: var(--text);
  }

  /* “Alles löschen” */
  #clearBtn{
    background: var(--danger);
    color: #fff;
    border: 1px solid rgba(255,0,0,.25);
    font-size: .95rem;
  }

  /* Deine 3-Zeilen-Struktur */
  .single-row{ justify-content: center; }
  .full-btn{ width: 100%; }

  .triple-row{ width: 100%; }
  .triple-row .btn-neu{ flex: 1; }
  .triple-row .btn-wide{ flex: 3; }

  /* (Wenn du “Neu” grün willst wie vorher) */
  #resetInputsBtn{
    background: linear-gradient(135deg, #1a662c, #218838);
    color: #fff;
    border: none;
  }

  /* Export / Import Farben (falls du diese Klassen nutzt) */
  .btn-export{ background: #f39c12; color: #fff; }
  .btn-import{ background: #7d3cff; color: #fff; }

  /* ===== Analyse Modal (mobile) ===== */
  #analysisModal{
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(3px);
    z-index: 1100;
  }

  .analysis-sheet{
    position: relative;
    width: 94vw;
    padding: 14px;
    border-radius: var(--radius);
    background: #fff;
    color: #222;
    box-shadow: 0 14px 40px rgba(0,0,0,.45);
  }

  .analysis-body{
    max-height: 66vh;
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: .98rem;
  }

  .close-x{
    position: absolute;
    top: 10px;
    right: 12px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: #333;
    font-size: 1.1rem;
    padding: 4px 6px;
    border-radius: 8px;
  }

  .analysis-close-btn{
    display: block;
    margin: 16px auto 0;
    padding: 10px 20px;
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid rgba(0,0,0,.25);
    cursor: pointer;
    font-weight: 700;
  }

  /* ===== Kleine WebKit Scrollbars ausblenden ===== */
  .paper::-webkit-scrollbar,
  .panel-left::-webkit-scrollbar{
    display: none;
  }
}

.panel-left .action-row {
  width: 100%;
}

/* Alle Buttons im Left Panel: standardmäßig volle Höhe + keine Schrumpfung */
.panel-left .action-row button {
  height: var(--h);
  min-width: 0;     /* wichtig für Flex */
}

/* 1) EINTRAG: allein in der Reihe -> volle Breite */
.panel-left .action-row #addBtn {
  flex: 1;
  width: 100%;
}

/* 2) EXPORT/IMPORT/NEU: zusammen in einer Reihe -> gesamte Reihe 100% */
.panel-left .action-row.triple-row {
  width: 100%;
}

/* Buttons in der triple-row gleich breit (1/3 - 1/3 - 1/3) */
.panel-left .action-row.triple-row button {
  flex: 1;
  
}

/* 3) ALLES LÖSCHEN: volle Breite */
.panel-left #clearAllRow #clearBtn {
  width: 100%;
  flex: 1;
}

/* Optional: Abstände zwischen den Reihen noch enger */
.panel-left .action-row {
  margin: 10px 0;   /* oder 2px 0, wenn du es noch dichter willst */
}


/* ============================================================
   ANALYSE PANEL — Layout: 2 Zeilen Controls + Button voll breit
   ============================================================ */

/* ============================================================
   ANALYSE PANEL — clean & stable
   ============================================================ */

/* Abstand: Controls oben, Button weiter unten */
.analysis-panel .analysis-controls{
  margin: 10px 0 6px;
}
.analysis-panel .analysis-controls + .analysis-controls{
  margin-top: 14px !important;  /* ✅ Analyse-Button nach unten */
}

/* Reihen */
.analysis-panel .controls-row{
  display: flex;
  width: 100%;
  gap: 10px;
  margin: 6px 0;
}
.analysis-panel .controls-row > *{
  flex: 1;
  min-width: 0;
}

/* Mini-select (Jahr/Monat) */
.analysis-panel .mini-select{
  height: var(--h);
  border-radius: var(--radius-sm);
  font-size: 1rem;
  font-weight: 700;

  background: var(--muted) !important;
  border: 1px solid var(--border) !important;
  color: var(--text) !important;
  box-shadow: none !important;

  text-align: center !important;
  text-align-last: center !important;

  /* Pfeil ausblenden */
  -webkit-appearance: none !important;
  -moz-appearance: none !important;
  appearance: none !important;
  background-image: none !important;

  /* mehr Luft oben/unten */
  padding: 14px 12px !important;
  line-height: 1 !important;
}
.analysis-panel .mini-select::-ms-expand{ display:none !important; }

.analysis-panel .mini-select:focus{
  background: var(--muted) !important;
  outline: none !important;
  box-shadow: none !important;
}

/* Toggle Buttons (Kategorie/Type) */
.analysis-panel .toggle-btn{
  height: var(--h);
  border-radius: var(--radius-sm);
  font-size: 1rem;
  font-weight: 700;

  background: var(--muted) !important;
  border: 1px solid var(--border) !important; /* ✅ immer 1px */
  color: var(--text) !important;
  box-shadow: none !important;

  display: flex;                 /* ✅ verhindert “komisches” Verhalten */
  align-items: center;
  justify-content: center;
}

.analysis-panel .toggle-btn:hover:not(.active),
.analysis-panel .toggle-btn:focus-visible:not(.active){
  background: var(--muted) !important;
  outline: none !important;
  box-shadow: none !important;
}

/* ACTIVE = exakt wie Neu (grün), aber ohne Größenänderung */
.analysis-panel .toggle-btn.active{
  background: linear-gradient(135deg, #1a662c, #218838) !important;
  color: #fff !important;
  border: 1px solid transparent !important; /* ✅ statt border:none */
}

/* Analyse Button: wie Eintrag, kein Rand */
.analysis-panel #analysisBtn{
  width: 100%;
  height: var(--h);
  border-radius: var(--radius-sm);
  font-size: 1rem;
  font-weight: 700;

  border: none !important;
  outline: none !important;
  box-shadow: none !important;

  -webkit-appearance: none !important;
  appearance: none !important;
}
.analysis-panel #analysisBtn:focus,
.analysis-panel #analysisBtn:focus-visible{
  outline: none !important;
  box-shadow: none !important;
}

/* Dropdown Optionen überall (wenn geöffnet) */
select option{
  background: var(--panel) !important;
  color: var(--text) !important;
  text-align: center !important;
}


.panel-right select.minimal,
.panel-right .field select {
  -webkit-appearance: none !important; /* iOS/Safari/Chrome */
  -moz-appearance: none !important;    /* Firefox */
  appearance: none !important;         /* Standard */

  background-image: none !important;   /* falls Browser eigenes Icon nutzt */
  padding-right: 12px !important;      /* kein Platz für Pfeil nötig */
}

/* Legacy Edge/IE: Pfeil ausblenden (schadet nicht) */
.panel-right select.minimal::-ms-expand,
.panel-right .field select::-ms-expand {
  display: none !important;
}

.analysis-panel .analysis-controls + .analysis-controls{
  margin-top: 16px !important;  /* z.B. 10–20px */
}




</style>
</head>













	

<body>
  <h1>💰 Finanz Tracker</h1>

  <div class="container">

       <input 
        
           type="text"
           id="amountInput"

           enterkeyhint="done">

<div class="action-row">

    <!-- PANEL 3 — ANALYSE (komplett separiert!) -->
    <div class="analysis-panel">
      <h2>📊 Analyse</h2>

  
<div class="analysis-controls">

  <!-- Zeile 1: Jahr / Monat (1 : 2) -->

    </div>

  <!-- ANALYSE MODAL (unverändert) -->

<script>
/* ===================== STATE / STORAGE ===================== */
let entries = [];
let categories = [];
let tags = [];

let entryMap = new Map(); // schneller Lookup

const storageKey = 'finanztracker_v3';

const today = () => new Date().toISOString().split('T')[0];
const generateId = () =>
  'e_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ===================== STORAGE ===================== */
function load() {
  const d = JSON.parse(localStorage.getItem(storageKey) || '{}');
  entries = d.entries || [];
  categories = d.categories || ['Essen', 'Miete', 'Freizeit'];
  tags = d.tags || ['Fix', 'Variabel', 'Abo'];

  entryMap.clear();
  for (const e of entries) {
    if (!e.id) e.id = generateId();
    entryMap.set(e.id, e);
  }
}

function save() {
  localStorage.setItem(storageKey, JSON.stringify({ entries, categories, tags }));
}


/* ===================== DERIVED LISTS ===================== */
/* Erzeugt Kategorien & Types NUR aus existierenden Einträgen */
function rebuildCategoriesAndTags() {
  const catSet = new Set();
  const tagSet = new Set();

  for (const e of entries) {
    if (e.category && e.category.trim() !== "") {
      catSet.add(e.category.trim());
    }
    if (e.tag && e.tag.trim() !== "") {
      tagSet.add(e.tag.trim());
    }
  }

  categories = Array.from(catSet).sort((a, b) =>
    a.localeCompare(b, 'de')
  );

  tags = Array.from(tagSet).sort((a, b) =>
    a.localeCompare(b, 'de')
  );
}

/* ===================== SELECT HELPERS ===================== */
function addEmptyPlaceholder(select) {
  const opt = document.createElement('option');
  opt.value = '';
  opt.textContent = '\u00A0';
  opt.selected = true;
  select.appendChild(opt);
}

function fillSelectWithPlaceholder(select, items = []) {
  select.innerHTML = '';
  addEmptyPlaceholder(select);

  const f = document.createDocumentFragment();
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item;
    opt.textContent = item;
    f.appendChild(opt);
  });

  select.appendChild(f);
}


function fillCategoryFilterSelectWithTypeOptions(select, categoriesList = []) {
  select.innerHTML = '';
  addEmptyPlaceholder(select);

  // ✅ Feste Filteroptionen (nur im rechten Panel)
  select.appendChild(new Option('Ausgabe 💸', '__type:expense'));
  select.appendChild(new Option('Einnahme 💰', '__type:income'));

  // ✅ Danach normale Kategorien (alphabetisch – kommen schon sortiert rein,
  // aber wir sortieren hier zur Sicherheit nochmal)
  const sorted = [...categoriesList].sort((a, b) => a.localeCompare(b, 'de'));
  
for (const c of sorted) {
    select.appendChild(new Option(c, c));
  }
}



/* ===================== UPDATE SELECTS ===================== */
function updateSelects() {
  fillSelectWithPlaceholder(categorySelect, categories);
  fillSelectWithPlaceholder(tagSelect, tags);

  fillCategoryFilterSelectWithTypeOptions(categoryFilterSelect, categories);
  fillSelectWithPlaceholder(tagFilterSelect, tags);
}

/* ===================== DATE SELECTS (RIGHT PANEL) ===================== */
function fillYearSelect() {
  yearSelect.innerHTML = '';
  addEmptyPlaceholder(yearSelect);

  const nowY = new Date().getFullYear();
  const f = document.createDocumentFragment();

  for (let y = nowY - 10; y <= nowY + 2; y++) {
    f.appendChild(new Option(y, y));
  }
  yearSelect.appendChild(f);
}

function fillMonthSelect() {
  fillSelectWithPlaceholder(monthSelect, Array.from({ length: 12 }, (_, i) => i + 1));
}

function getDaysInMonth(year, month) {
  if (!year || !month) return 31;
  return new Date(year, month, 0).getDate();
}

function fillDaySelect() {
  const y = parseInt(yearSelect.value);
  const m = parseInt(monthSelect.value);

  const days = getDaysInMonth(y, m);
  const prev = daySelect.value;

  daySelect.innerHTML = '';
  addEmptyPlaceholder(daySelect);

  const f = document.createDocumentFragment();
  for (let d = 1; d <= days; d++) f.appendChild(new Option(d, d));

  daySelect.appendChild(f);

  if (prev && prev <= days) daySelect.value = prev;
}

/* ===================== DATE SELECTS (LEFT MINI BOXES) ===================== */
function fillLeftYearSelect() {
  const now = new Date().getFullYear();
  for (let y = now - 10; y <= now + 2; y++) {
    leftYearSelect.add(new Option(y, y));
  }
}

function fillLeftMonthSelect() {
  for (let m = 1; m <= 12; m++) {
    leftMonthSelect.add(new Option(m, m));
  }
}

/* ===================== FLOATING LABELS ===================== */

function updateFilledState(el) {
  const f = el.closest('.field');
  if (!f) return;

  // Für Selects: echte Werte prüfen
  if (el.tagName === "SELECT") {
    const v = el.value;

    const meaningful =
      v !== null &&
      v !== "" &&
      v !== " " &&
      v !== "\u00A0";

    f.classList.toggle("filled", meaningful);
    el.classList.toggle("has-value", meaningful);
    return;
  }

  // Für Inputs: normale Prüfung
  f.classList.toggle("filled", el.value.trim().length > 0);
}

function updateAllFilled() {
  document.querySelectorAll('.field input, .field select').forEach(updateFilledState);
}

document.addEventListener('input', e => {
  if (e.target.matches('.field input, .field select')) updateFilledState(e.target);
});
document.addEventListener('change', e => {
  if (e.target.matches('.field input, .field select')) updateFilledState(e.target);
});
	
document.querySelectorAll('.field select').forEach(sel => {

  sel.addEventListener("focus", () => {
    sel.classList.add("focused");
  });

  sel.addEventListener("blur", () => {
    sel.classList.remove("focused");

    // Wenn kein echter Wert → floating zurücksetzen
    if (!sel.value || sel.value.trim() === "" || sel.value === "\u00A0") {
      sel.classList.remove("has-value");
      sel.closest(".field").classList.remove("filled");
    }
  });

  sel.addEventListener("change", () => {
    if (sel.value && sel.value.trim() !== "" && sel.value !== "\u00A0") {
      sel.classList.add("has-value");
      sel.closest(".field").classList.add("filled");
    } else {
      sel.classList.remove("has-value");
      sel.closest(".field").classList.remove("filled");
    }
  });

});

/* ===================== FILTER ===================== */
function filterEntries() {
  const year = parseInt(yearSelect.value);
  const month = parseInt(monthSelect.value);
  const day = parseInt(daySelect.value);

  
const rawCat = categoryFilterSelect.value;
const tag = tagFilterSelect.value;

let cat = rawCat;
let typeFilter = "";

// ✅ Wenn die Auswahl eine Type-Option ist → nach type filtern
if (rawCat && rawCat.startsWith("__type:")) {
  typeFilter = rawCat.split(":")[1]; // "expense" oder "income"
  cat = ""; // Kategorie-Filter deaktivieren
}


  const selectedDate = year && month && day ? new Date(year, month - 1, day) : null;

  const filtered = entries.filter(e => {
    const d = new Date(e.date);
    return (!year || d.getFullYear() === year)
        && (!month || d.getMonth() + 1 === month)
        && (!day || d.getDate() === day)
        && (!typeFilter || e.type === typeFilter)
        && (!cat || e.category === cat)
        && (!tag || e.tag === tag);
  });

  let basis = 0;
  let basisDate = null;

  if (selectedDate) {
    basisDate = selectedDate.toISOString().split('T')[0];
    for (const e of entries) {
      const d = new Date(e.date);
      if (d < selectedDate && (!typeFilter || e.type === typeFilter) &&  (!cat || e.category === cat) && (!tag || e.tag === tag)) {
        basis += e.type === 'income' ? e.amount : -e.amount;
      }
    }
  }

  renderEntries(filtered, basis, basisDate);
}

/* RIGHT PANEL LISTENERS */
yearSelect.addEventListener('change', () => { fillDaySelect(); filterEntries(); updateAllFilled(); });
monthSelect.addEventListener('change', () => { fillDaySelect(); filterEntries(); updateAllFilled(); });
daySelect.addEventListener('change', () => { filterEntries(); updateAllFilled(); });
categoryFilterSelect.addEventListener('change', filterEntries);
tagFilterSelect.addEventListener('change', filterEntries);

/* ===================== RENDER LIST ===================== */
function renderEntries(list, basis = 0, transferDate = null) {
  entriesList.innerHTML = '';
  const f = document.createDocumentFragment();
  let sum = basis;

  if (basis !== 0 && transferDate) {
    f.appendChild(buildEntry({
      category: 'Übertrag',
      tag: 'Vortag',
      date: transferDate,
      description: 'Saldo vom Vortag',
      type: basis >= 0 ? 'income' : 'expense',
      amount: Math.abs(basis),
      id: null
    }));
  }

  for (const e of list) {
    sum += e.type === 'income' ? e.amount : -e.amount;
    f.appendChild(buildEntry(e));
  }

  entriesList.appendChild(f);
  dailyBalance.textContent = `💰 Bilanz: ${sum.toFixed(2)} €`;
}

function buildEntry(e) {
  const div = document.createElement('div');
  div.className = 'entry';

  // ❌ Löschen-Icon nur anzeigen, wenn Eintrag eine echte ID hat
  const deleteIcon = e.id ? `<span onclick="deleteEntry('${e.id}')">❌</span>` : ``;

  div.innerHTML = `
    <div class="meta">
      <strong>${e.category} • ${e.tag}</strong>
      <div class="small">${e.date} — ${e.description || ''}</div>
    </div>

    <div class="${e.type === 'income' ? 'amount-income' : 'amount-expense'}">
      ${e.type === 'income' ? '+' : '-'}${e.amount.toFixed(2)} €
    </div>

    <div class="entry-actions">
      ${deleteIcon}
    </div>
  `;

  return div;
}

/* ===================== DELETE — VEREINFACHTE SICHERHEITSABFRAGE ===================== */
window.deleteEntry = (id) => {
  const e = entryMap.get(id);
  if (!e) return;

  if (!confirm('Eintrag löschen?')) return;

  entries = entries.filter(x => x.id !== id);
  entryMap.delete(id);
  
rebuildCategoriesAndTags(); 
save();
updateSelects();
filterEntries();
updateAllFilled();

};

 amountInput.value = "";

/* ===================== ANALYSE ===================== */

let analysisMode = {
  category: false,
  tag: false
};

const btnCat = document.getElementById('modeCategoryBtn');
const btnTag = document.getElementById('modeTagBtn');

function toggle(btn, key) {
  analysisMode[key] = !analysisMode[key];
  btn.classList.toggle('active', analysisMode[key]);
}

btnCat.addEventListener('click', () => toggle(btnCat, 'category'));
btnTag.addEventListener('click', () => toggle(btnTag, 'tag'));
document.getElementById("analysisCloseBtn").classList.remove("active");

const analysisBtn = document.getElementById('analysisBtn');
const analysisModal = document.getElementById('analysisModal');
const analysisBody = document.getElementById('analysisBody');
const analysisCloseX = document.getElementById('analysisCloseX');
const analysisCloseBtn = document.getElementById('analysisCloseBtn');

analysisCloseX.addEventListener('click', () => analysisModal.style.display = 'none');
analysisCloseBtn.addEventListener('click', () => analysisModal.style.display = 'none');

const eur = (n) => new Intl.NumberFormat('de-DE', { style:'currency', currency:'EUR' }).format(n);
const dmy = (d) => d.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' });
const monthName = (m) => new Date(2000, m-1, 1).toLocaleString('de-DE', { month:'long' });

function balanceAt(stichtag) {
  let sum = 0;
  for (const e of entries) {
    const dt = new Date(e.date);
    if (dt <= stichtag) sum += e.type === 'income' ? e.amount : -e.amount;
  }
  return sum;
}

function entriesInRange(start, end) {
  return entries.filter(e => {
    const dt = new Date(e.date);
    return dt >= start && dt <= end;
  });
}

// Analyse (vereinfachte Meldung, wenn kein Datum gewählt)
analysisBtn.addEventListener('click', () => {
  const year = parseInt(leftYearSelect.value);
  const month = parseInt(leftMonthSelect.value);

  if (!year) {
    alert('Datum wählen');
    return;
  }

  let start, end, prevStart, prevEnd, label;

  if (month) {
    start = new Date(year, month - 1, 1);
    end   = new Date(year, month, 0);
    label = `${monthName(month)} ${year}`;

    const pm = month === 1 ? 12 : month - 1;
    const py = month === 1 ? year - 1 : year;

    prevStart = new Date(py, pm - 1, 1);
    prevEnd   = new Date(py, pm, 0);
  } else {
    start = new Date(year, 0, 1);
    end   = new Date(year, 11, 31);
    label = `Jahr ${year}`;

    prevStart = new Date(year - 1, 0, 1);
    prevEnd   = new Date(year - 1, 11, 31);
  }
  
  const scoped = entriesInRange(start, end);
  const zeitLabel = month ? 'diesem Monat' : 'diesem Jahr';
  const net = (e) => (e.type === 'income' ? e.amount : -e.amount);
  const signWord = (sum) =>
      sum > 0 ? 'eingenommen'
    : sum < 0 ? 'ausgegeben'
    : 'weder ausgegeben noch eingenommen';

  const groupCat = analysisMode.category;
  const groupTag = analysisMode.tag;

  let out = `📅 Analyse für ${label}\n\n`;

  if (scoped.length === 0) {
    out += "Keine Einträge.\n\n";
  } else {
    out += "Für das ausgewählte Datum sind folgende Einträge vorhanden:\n\n";

    if (groupCat && !groupTag) {
      // NUR Kategorie
      const byCat = new Map();
      for (const e of scoped) byCat.set(e.category, (byCat.get(e.category) || 0) + net(e));

      const cats = [...byCat.keys()].sort((a, b) => a.localeCompare(b, 'de'));
      if (cats.length === 0) {
        out += "Keine Einträge.";
      } else {
        for (const c of cats) {
          const sum = byCat.get(c);
          const verb = signWord(sum);
          const coloredAmount =
              sum >= 0
                  ? `<span class="analysis-pos">${eur(Math.abs(sum))}</span>`
                  : `<span class="analysis-neg">${eur(Math.abs(sum))}</span>`;
          out += `<p style="text-align:center;"> Kategorie: <span class="analysis-blue">${c}</span><br> </p>`;
          out += `<p style="margin:0 0 6px 0; text-align:left;">• In ${zeitLabel} hast du in <span class="analysis-blue">${c}</span> ${coloredAmount} ${verb}.</p>`;
          out += `<div style="text-align:center; opacity:0.5; margin:6px 0 12px 0;">─────────────────────────────</div>`;
        }
      }

    } else if (!groupCat && groupTag) {
      // NUR Tag
      const byTag = new Map();
      for (const e of scoped) byTag.set(e.tag, (byTag.get(e.tag) || 0) + net(e));

      const tagsList = [...byTag.keys()].sort((a, b) => a.localeCompare(b, 'de'));
      if (tagsList.length === 0) {
        out += "Keine Einträge.\n\n";
      } else {
        for (const t of tagsList) {
          const sum = byTag.get(t);
          const verb = signWord(sum);
          const coloredAmount =
              sum >= 0
                  ? `<span class="analysis-pos">${eur(Math.abs(sum))}</span>`
                  : `<span class="analysis-neg">${eur(Math.abs(sum))}</span>`;
          out += `<p style="text-align:center;"> Type: <span class="analysis-tag-green">${t}</span><br> </p>`;
          out += `<p style="margin:0 0 6px 0; text-align:left;">• In ${zeitLabel} hast du für <span class="analysis-tag-green">${t}</span> ${coloredAmount} ${verb}.</p>`;
          out += `<div style="text-align:center; opacity:0.5; margin:6px 0 12px 0;">─────────────────────────────</div>`;
        }
      }

    } else if (groupCat && groupTag) {
      // Kategorie + Tag verschachtelt
      const byCatTag = new Map();
      for (const e of scoped) {
        if (!byCatTag.has(e.category)) byCatTag.set(e.category, new Map());
        const inner = byCatTag.get(e.category);
        inner.set(e.tag, (inner.get(e.tag) || 0) + net(e));
      }

      const cats = [...byCatTag.keys()].sort((a, b) => a.localeCompare(b, 'de'));

      for (const c of cats) {
        const inner = byCatTag.get(c);
        const tagsList = [...inner.keys()].sort((a, b) => a.localeCompare(b, 'de'));

        for (const t of tagsList) {
          const sum = inner.get(t);
          const verb = signWord(sum);
          const coloredAmount =
              sum >= 0
                  ? `<span class="analysis-pos">${eur(Math.abs(sum))}</span>`
                  : `<span class="analysis-neg">${eur(Math.abs(sum))}</span>`;
			
          out += `<p style="text-align:center;"> Kategorie: <span class="analysis-blue">${c}</span> - Type: <span class="analysis-tag-green">${t}</span></p>`;
          out += `<p style="margin:0 0 6px 0; text-align:left;">• In ${zeitLabel} hast du für <span class="analysis-tag-green">${t}</span> unter <span class="analysis-blue">${c}</span> ${coloredAmount} ${verb}.</p>`;
          out += `<div style="text-align:center; opacity:0.5; margin:6px 0 12px 0;">─────────────────────────────</div>`;
        }
      }

    } else {
      out += "ℹ️ Keine Gruppierung aktiv (Kategorie/Type). Es wird nur der Bilanzvergleich angezeigt.\n\n";
    }
  }

  // Bilanzvergleich
  const prevBal = balanceAt(prevEnd);
  const curBal  = balanceAt(end);
  const delta   = curBal - prevBal;

  out += ` <div style="text-align:center; opacity:10; margin:6px 0 12px 0; font-size: 20px;">Bilanzvergleich</div>`;
  out += `• Bilanz am ${dmy(prevEnd)}: ${eur(prevBal)}\n`;
  out += `• Bilanz am ${dmy(end)}: ${eur(curBal)}\n`;
  out += `• Veränderung: ${delta >= 0 ? "+" : "–"}${eur(Math.abs(delta))}\n`;

  analysisBody.innerHTML = out;
  analysisModal.style.display = "flex";
});

const themeToggle = document.getElementById("themeToggle");

themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("light-mode");

  // Emoji wechseln
  if (document.body.classList.contains("light-mode")) {
    themeToggle.textContent = "🌙"; // Mond
  } else {
    themeToggle.textContent = "☀️"; // Sonne
  }
});


	

function hasMeaningfulValue(v) {
  return v != null && v !== "" && v !== "\u00A0";
}

function markSelectFilled(select) {
  const filled = hasMeaningfulValue(select.value);
  // Klasse am <select> selbst (für CSS-Selektor .has-value)
  select.classList.toggle("has-value", filled);
  // Klasse am umgebenden .field (für generische Floating-Regel)
  const f = select.closest(".field");
  if (f) f.classList.toggle("filled", filled);
}


/* ===================== EXPORT ===================== */
document.getElementById("exportBtn").addEventListener("click", () => {
  const data = {
    version: "finanztracker_v3",
    exportedAt: new Date().toISOString(),
    entries,
    categories,
    tags
  };

  const blob = new Blob(
    [JSON.stringify(data, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  const date = new Date().toISOString().split("T")[0];
  a.href = url;
  a.download = `finanztracker_backup_${date}.json`;

  document.body.appendChild(a);
  a.click();

  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});


/* ===================== IMPORT ===================== */
const importBtn = document.getElementById("importBtn");
const importInput = document.getElementById("importFileInput");

importBtn.addEventListener("click", () => {
  importInput.click();
});

importInput.addEventListener("change", () => {
  const file = importInput.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);

      // Sicherheitscheck
      if (
        !data ||
        !Array.isArray(data.entries) ||
        !Array.isArray(data.categories) ||
        !Array.isArray(data.tags)
      ) {
        alert("Ungültige Datei");
        return;
      }

      if (!confirm("Import überschreibt ALLE aktuellen Daten. Fortfahren?")) {
        return;
      }

      // Daten übernehmen (1:1)
      entries = data.entries;
      categories = data.categories;
      tags = data.tags;

      // Map neu aufbauen
      entryMap.clear();
      for (const e of entries) {
        if (!e.id) e.id = generateId();
        entryMap.set(e.id, e);
      }

     
rebuildCategoriesAndTags();
save();

updateSelects();
filterEntries();
updateAllFilled();


      alert("✅ Import erfolgreich");
    } catch (err) {
      alert("Fehler beim Importieren der Datei");
      console.error(err);
    } finally {
      importInput.value = "";
    }
  };

  reader.readAsText(file);
});

// Nach Initialisierung des Datums:
markSelectFilled(yearSelect);
markSelectFilled(monthSelect);
markSelectFilled(daySelect);



/* ===================== INIT ===================== */

load();
updateSelects();

fillYearSelect();
fillMonthSelect();
fillDaySelect();

fillLeftYearSelect();
fillLeftMonthSelect();

// Heutiges Datum in linkes Date-Input
dateInput.value = today();
updateFilledState(dateInput); // damit linkes Label hochgeht

// Rechts: Jahr/Monat/Tag setzen (als String!)
const now = new Date();
yearSelect.value  = String(now.getFullYear());
monthSelect.value = String(now.getMonth() + 1);
fillDaySelect(); // Tage neu befüllen, sonst passt der Tag nicht
daySelect.value   = String(now.getDate());

// >>> HIER: Jetzt markieren (erst JETZT stimmen die values!)
markSelectFilled(yearSelect);
markSelectFilled(monthSelect);
markSelectFilled(daySelect);

// Danach erst alles weitere
updateAllFilled();
filterEntries();

dateInput.onkeydown = () => false;
dateInput.onpaste = () => false;
dateInput.oninput = function() { this.value = this.value; };
</script>
